name: Build fish.voice APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder
        id: proj
        run: |
          F=$(find . -name settings.gradle -not -path "./.git/*" | head -n 1)
          if [ -z "$F" ]; then
            Z=$(find . -iname "*.zip" -not -path "./.git/*" | head -n 1)
            echo "settings.gradle не найден, ищу zip: $Z"
            if [ -n "$Z" ]; then
              mkdir -p _proj
              unzip -q -o "$Z" -d _proj
              F=$(find _proj -name settings.gradle | head -n 1)
            fi
          fi
          if [ -z "$F" ]; then
            echo "ПРОЕКТ НЕ НАЙДЕН. Вот что лежит в репозитории:"
            find . -not -path "./.git/*" | head -60
            exit 1
          fi
          D=$(dirname "$F")
          echo "Проект: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          ls -la "$D"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --console=plain

      - name: Collect APK
        run: cp "${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" fish.voice-v1.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fish.voice-v1-apk
          path: fish.voice-v1.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: fish.voice v1 (сборка ${{ github.run_number }})
          files: fish.voice-v1.apk
