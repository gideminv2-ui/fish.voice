name: Build fish.voice APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder
        id: proj
        run: |
          F=$(find . -name settings.gradle -not -path "./.git/*" | head -n 1)
          echo "Found: $F"
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          build-root-directory: ${{ steps.proj.outputs.dir }}

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Collect APK
        run: cp "${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" fish.voice-v1.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fish.voice-v1-apk
          path: fish.voice-v1.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: fish.voice v1 (сборка ${{ github.run_number }})
          files: fish.voice-v1.apk
